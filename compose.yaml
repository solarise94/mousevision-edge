services:
  mousevision:
    build:
      context: .
      dockerfile: Containerfile
    image: mousevision-edge:dev
    container_name: mousevision-edge
    ports:
      - "8766:8766"
    environment:
      MOUSEVISION_HOST: "0.0.0.0"
      MOUSEVISION_PORT: "8766"
      MOUSEVISION_OUTPUT_DIR: "/app/output"
      MOUSEVISION_MAX_UPLOAD_MB: "250"
      # Fixed ffmpeg decode (same binary as Containerfile apt package).
      MOUSEVISION_VIDEO_BACKEND: "ffmpeg"
    volumes:
      - ./output:/app/output:Z
    restart: unless-stopped
