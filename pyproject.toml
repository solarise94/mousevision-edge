[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mousevision"
version = "0.1.0"
description = "MouseVision Edge — visual weighing core for lab mouse scales"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "fastapi>=0.115,<0.129",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<0.29"]

[project.scripts]
mousevision-poc = "tools.run_poc:main"

[tool.setuptools.packages.find]
include = ["mousevision*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
