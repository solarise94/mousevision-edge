; ============================================================================
; K797 BLE 虚拟硬件 (ESP32-C3) — PlatformIO 工程配置
; ----------------------------------------------------------------------------
; 目标板：esp32-c3-devkitm-1（任何 ESP32-C3 板均可，引脚按板改）
; 框架  ：Arduino (espressif32 平台)
; 蓝牙库：h2zero/NimBLE-Arduino ^2.5.0
;
; 固件源码针对 NimBLE-Arduino 2.x 编写（见 src/main.cpp 顶部 API 说明）。
; NimBLE 1.x 的可连接/广播接口（setConnectable(bool)）在 2.x 已废弃，
; 故不要降到 1.x，否则编译失败。
;
; 仅用于开发/测试，不可连接、不建立 GATT Server。
; ============================================================================
[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform          = espressif32
board             = esp32-c3-devkitm-1
framework         = arduino
monitor_speed     = 115200
lib_deps          =
    h2zero/NimBLE-Arduino @ ^2.5.0
; 串口监视器自动回显换行；按 Ctrl+C 退出
monitor_filters   = esp32_exception_decoder, time
build_flags       =
    -std=gnu++17
    ; 状态灯（可选）：ESP32-C3-DevKitM-1 板载 RGB NeoPixel 在 GPIO8，
    ; 默认不启用以避免与 STRAP/外设冲突。如需启用请在下方取消注释。
    ; -D K797_LED_PIN=8
