device_id: scale01
scale_profile: current_scale_v1

# Frame geometry (720x1280 RefVideo)
frame_width: 720
frame_height: 1280

# LCD detection / ROI (server-side when using http_ocr)
lcd_detect:
  mode: auto   # auto | fixed
  hsv_low: [90, 40, 80]
  hsv_high: [130, 255, 255]
  min_area: 8000
  min_width: 150
  min_height: 40

# Optional fixed ROI (first-frame hint / fixed mode)
weight_roi:
  x: 145
  y: 780
  w: 430
  h: 110

lcd_normalization:
  width: 480
  height: 128
  # Digit band on LCD crop (TemplateReader-compatible); excludes '+' / 'g'.
  digit_roi: [0.20, 0.08, 0.66, 0.84]
  digit_slots: 4
  slot_margin: 0.03
  ink_trim: true
  ink_trim_pad: 0.05
  # projected = vertical-ink digit runs; fixed = equal 4-way split
  slot_mode: projected
  # Stage B: keep axis-aligned; enable warp only after corner localization is trusted.
  allow_warp: false
  skew_warp_min: 8.0
  skew_warp_threshold: 35.0
  min_locator_confidence: 0.55

# Production LCD OCR decoder (override with LCD_OCR_DECODER env).
lcd_ocr:
  decoder: classic_v2

# Mouse blob detector (UI overlay + leave hold)
mouse_detect:
  gray_threshold: 70
  min_area: 3000
  # Reject pan-sized stain/reflection blobs (empty-pan false positives that
  # held the fusion zero-hold and merged sessions). Real mice: 20k-100k px.
  max_area: 130000
  # Real mice are near-black: blob 5th-percentile gray must be <= 30, and the
  # blob mean must be clearly darker than the pan (<= 0.62 * ROI median).
  dark_p05: 30
  dark_ratio: 0.62
  aspect_ratio: [0.3, 2.0]
  x_ratio: [0.12, 0.88]
  use_otsu: true
  # pan_roi: absolute scale-pan pixels (NOT weight_roi / LCD). Calibrate on device.
  # pan_roi: {x: 80, y: 120, w: 560, h: 520}

templates_dir: assets/templates

# Weight reader:
#   agent     — full-video gemini-3-flash-agent (production preferred)
#   http_ocr  — classic seven-seg lcd-ocr service (fallback / lab)
#   template  — offline template PoC
# Env MOUSEVISION_WEIGHT_READER overrides this value.
weight_reader: template
ocr_api:
  base_url: http://mousevision-lcd-ocr:8768
  timeout_ms: 2000

# Full-video agent (CPA / CLIProxy). Prefer original file; light-transcode only
# when over max_upload_bytes. Never default to 1fps.
agent:
  model: gemini-3-flash-agent
  # base_url / api_key: prefer env MOUSEVISION_AGENT_BASE_URL / MOUSEVISION_AGENT_API_KEY
  prefer_original: true
  max_upload_bytes: 12000000
  timeout_s: 420
  review_confidence: 0.7
  fallback: none   # none | http_ocr | template
  light_transcode:
    max_width: 720
    min_fps: 8
    crf: 28
  # Local evidence attachment: sample video frames, pick best photo per
  # session, write mouse_NNN/photo.jpg + platform_* into record.json.
  attach_photos: true
  photo_sample_interval_ms: 200
  photo_pad_s: 1.5
  photo_weight_tol: 0.25
  photo_window_s: 5.0

# Keep full source under run_*/source.* for training (not pruned with job_uploads).
retain_source_video: true
training_collect: true

# Temporal fusion (http_ocr path)
# window must be large enough for two sustained clusters to coexist (conflict detect).
temporal:
  window_size: 8
  min_agree: 3
  conflict_min_agree: 2
  weight_tol: 0.08
  min_confidence: 0.45
  one_seven_min_confidence: 0.55
  cluster_conflict_ratio: 0.35
  # Do not impose an animal-weight floor; expose low reads to fusion/review.
  min_weight: 0.0
  max_weight: 50.0
  stick_tol: 0.08
  # Bound the mouse-on-scale zero hold (re-tare transient): after 4 held zero
  # frames the zero passes through — a long zero run is a real empty scale.
  zero_hold_max_frames: 4

# Template matching / OCR confidence floor
match_threshold: 0.50
min_digit_confidence: 0.45
expected_digits: [3, 4]
min_reader_confidence: 0.35
max_jump_grams: 5.0
drop_jump_outliers: false

# Ring buffer
buffer_seconds: 12.0
buffer_max_items: 400

# State machine thresholds (grams)
empty_max: 0.15
enter_min: 1.0
leave_max: 0.30
leave_hold_frames: 10
weighing_min_samples: 5
# HTTP OCR only (SessionDriver forces 0 for TemplateReader / RefVideo):
empty_arm_frames: 3
# RefVideo turnaround can be ~3–5s; 2500ms was skipping the next real session.
reenter_cooldown_ms: 1000
# ENTER fires only after 2 consecutive non-zero fused reads (blocks single
# fused spikes); ENTER aborts after 3 consecutive confirmed zeros (was: 1) and
# after 15s stuck (was: never — merged the next animal into the session).
enter_sustain_frames: 2
enter_zero_hold_frames: 3
max_enter_seconds: 15
# Mouse detector is advisory only (stained pans false-positive, dirty pans
# never fire) — do not hard-gate ENTER on it.
require_mouse_for_enter: false

# Session weight from raw-read clustering (http_ocr path). Robust to fused
# curve starvation: dominant raw cluster over [enter-3s, leave] is the weight.
raw_cluster:
  enabled: true
  tol: 0.12
  min_conf: 0.35
  stable_frac: 0.60
  stable_min_votes: 4
  stable_max_span: 0.25
  conflict_min_votes: 3
  conflict_min_frac: 0.25
  pre_enter_ms: 3000

# Sustained raw reads BETWEEN sessions that never fused (restless animal)
# become manual hand-fill records instead of vanishing silently.
orphan_scan:
  enabled: true
  tol: 0.15
  min_votes: 3
  # Server-side decodes can be sparse: 3 reads span only ~0.33s there.
  min_span_ms: 250
  min_conf: 0.45

# Same weight again within 2s of a saved record = same animal re-adjusted.
dup_session:
  max_gap_ms: 2000
  weight_tol: 0.10

# Curve analyzer
platform_window_seconds: 0.8
platform_max_std: 0.35
near_zero: 0.5
max_session_seconds: 30
photo_match_tol: 0.02
photo_min_confidence: 0.45

# Video processing
# Migrated to time-based sampling (P0-a): frame_stride deprecated.
analysis_fps: 7.5
